{% extends 'base.html' %}
{% load static %}

{% block title %}Mebel olami - Bosh sahifa{% endblock %}

{% block content %}

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
    /* Page Title */
    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
    }

    .page-title i {
        color: var(--primary);
        font-size: 1.75rem;
        animation: iconPulse 2s ease-in-out infinite;
    }

    @keyframes iconPulse {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.1);
        }
    }

    @media (min-width: 768px) {
        .page-title {
            font-size: 1.75rem;
        }

        .page-title i {
            font-size: 2rem;
        }
    }

    /* Grid Layout */
    .categories-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    @media (min-width: 640px) {
        .categories-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
    }

    @media (min-width: 1024px) {
        .categories-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }
    }

    /* Modern Category Card */
    .category-card {
        position: relative;
        background: linear-gradient(135deg, rgba(236, 194, 153, 0.08) 0%, rgba(52, 152, 219, 0.08) 100%);
        border-radius: 16px;
        overflow: hidden;
        text-decoration: none;
        color: var(--text);
        border: 2px solid rgba(236, 194, 153, 0.2);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        min-height: 140px;
    }

    .dark-mode .category-card {
        background: linear-gradient(135deg, rgba(76, 44, 36, 0.15) 0%, rgba(80, 163, 211, 0.15) 100%);
        border-color: rgba(236, 194, 153, 0.15);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .category-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 40px rgba(236, 194, 153, 0.2);
        border-color: var(--primary);
    }

    .category-card:active {
        transform: translateY(-4px) scale(0.98);
        opacity: 0.9;
    }

    /* Card Image (if you add images later) */
    .category-card-image {
        width: 100%;
        height: 120px;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .category-card:hover .category-card-image {
        transform: scale(1.1);
    }

    /* Card Content */
    .category-card-content {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .category-card-icon {
        font-size: 2.5rem;
        color: var(--primary);
        margin-bottom: 8px;
        transition: transform 0.3s ease;
    }

    .category-card:hover .category-card-icon {
        transform: rotate(10deg) scale(1.1);
    }

    .category-card-title {
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        color: var(--text);
        margin: 0;
    }

    @media (min-width: 640px) {
        .category-card {
            min-height: 160px;
        }

        .category-card-content {
            padding: 20px;
        }

        .category-card-icon {
            font-size: 3rem;
        }

        .category-card-title {
            font-size: 1.125rem;
        }
    }

    /* Shimmer Effect */
    .category-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .category-card:hover::before {
        left: 100%;
    }

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text);
        opacity: 0.6;
    }

    .empty-state i {
        font-size: 4rem;
        margin-bottom: 16px;
        color: var(--primary);
    }
</style>

<h2 class="page-title">
    <i class="fas fa-layer-group"></i>
    Kategoriyani tanlang
</h2>

<div class="categories-grid">
    {% for cat in categories %}
    <a href="{% url 'category' cat.id %}" class="category-card">
        <div class="category-card-content">
            <i class="fas fa-couch category-card-icon"></i>
            <h3 class="category-card-title">{{ cat.name_uz }}</h3>
        </div>
    </a>
    {% empty %}
    <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p>Hozircha kategoriyalar mavjud emas</p>
    </div>
    {% endfor %}
</div>

<script>
    Telegram.WebApp.ready();
</script>

{% endblock %}
