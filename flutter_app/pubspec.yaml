name: furniture_platform_mobile
description: Furniture Platform — Android (Flutter) ilovasi. Xaridor va usta rollarini ajratadi.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  # GLB/USDZ 3D fayllarni ko'rish uchun (web'dagi <model-viewer> va iOS'dagi
  # RealityKit'ga mos — WebView orqali Google <model-viewer> komponentini yuklaydi).
  model_viewer_plus: ^1.7.0
  intl: ^0.19.0
  # Foydalanuvchi joylashgan viloyatni GPS orqali aniqlash uchun (bir nechta
  # viloyatda filiali bor firmalarning shu hududga tegishli mahsulotlarini
  # ko'rsatish filtri).
  geolocator: ^13.0.1
  # Mahsulot sahifasidagi "Ulashish" tugmasi uchun.
  share_plus: ^13.3.0
  # Bosh sahifadagi "rasm bilan qidirish" uchun kamera/galereyadan rasm tanlash.
  image_picker: ^1.1.2
  # Firma profilidagi ijtimoiy tarmoq havolalarini (Instagram/Telegram/h.k.)
  # tashqi brauzer/ilovada ochish uchun.
  url_launcher: ^6.3.1
  # Google orqali kirish — native Sign-In oqimi, natijada olingan ID token
  # backendga (`/auth/google/`) yuboriladi (qarang auth_store.dart).
  google_sign_in: ^6.2.1
  # Push (FCM) — backend orqali xabarnoma yuborish (qarang push_service.dart).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  # Ilova OLDINDA (foreground) ochiq bo'lganda FCM avtomatik OS tokchasiga
  # chiqarmaydi — shu holatda qo'lda mahalliy bildirishnoma ko'rsatish uchun.
  flutter_local_notifications: ^18.0.1
  # Mobil so'rov-imzosi (HMAC-SHA256) uchun — qarang device_signature.dart.
  crypto: ^3.0.5
  # Bildirishnoma qo'ng'irog'i sonini real vaqtda yangilash uchun — avval
  # 30s'da bir marta HTTP so'rov bilan so'ralardi (qarang notification_ws.dart).
  web_socket_channel: ^3.0.1
  # Ilova versiyasi/build raqamini (vcode) runtime'da o'qish uchun — qo'lda
  # qattiq yozib qo'yish o'rniga, `pubspec.yaml`dagi `version: X.Y.Z+BUILD`
  # avtomatik o'qiladi.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/google_logo.png
    - assets/icons/telegram_logo.png
