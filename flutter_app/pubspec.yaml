name: furniture_platform_mobile
description: Furniture Platform — Android (Flutter) ilovasi. Xaridor va usta rollarini ajratadi.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  # GLB/USDZ 3D fayllarni ko'rish uchun (web'dagi <model-viewer> va iOS'dagi
  # RealityKit'ga mos — WebView orqali Google <model-viewer> komponentini yuklaydi).
  model_viewer_plus: ^1.7.0
  intl: ^0.19.0
  # Foydalanuvchi joylashgan viloyatni GPS orqali aniqlash uchun (bir nechta
  # viloyatda filiali bor firmalarning shu hududga tegishli mahsulotlarini
  # ko'rsatish filtri).
  geolocator: ^13.0.1
  # Mahsulot sahifasidagi "Ulashish" tugmasi uchun.
  share_plus: ^7.2.2
  # Bosh sahifadagi "rasm bilan qidirish" uchun kamera/galereyadan rasm tanlash.
  image_picker: ^1.1.2
  # Firma profilidagi ijtimoiy tarmoq havolalarini (Instagram/Telegram/h.k.)
  # tashqi brauzer/ilovada ochish uchun.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
