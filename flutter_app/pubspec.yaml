publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  # GLB/USDZ 3D fayllarni ko'rish uchun (web'dagi <model-viewer> va iOS'dagi
  # RealityKit'ga mos — WebView orqali Google <model-viewer> komponentini yuklaydi).
  model_viewer_plus: ^1.7.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
