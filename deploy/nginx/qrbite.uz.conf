# qrbite.uz — VPS'dagi nginx, TLS'ni shu yerda tugatadi va Tailscale VPN
# orqali dev kompyuterga (Mac, Tailscale IP 100.69.182.71) qayta yo'naltiradi
# (reverse proxy). Ilovaning o'zi (Django backend :8000, Vite frontend :5173)
# haligacha Mac'da ishlaydi — VPS faqat ochiq internetga chiqish nuqtasi.
#
# Subdomen -> portal xaritasi (frontend/src/portal.js bilan bir xil):
#   qrbite.uz, www.qrbite.uz  -> market (mijozlar marketplace'i)
#   admin.qrbite.uz           -> admin
#   firma.qrbite.uz           -> firma
#   api.qrbite.uz             -> Django backend (shu jumladan Google Login
#                                verifikatsiyasi va Telegram bot webhook'i)
#
# SSL: wildcard sertifikat (*.qrbite.uz + qrbite.uz), masalan:
#   certbot certonly --manual --preferred-challenges dns \
#     -d qrbite.uz -d *.qrbite.uz
# (wildcard uchun DNS-01 talab qilinadi — HTTP-01 yetarli emas). Standart
# certbot yo'llari pastda ishlatilgan; boshqa joyga saqlagan bo'lsangiz
# `ssl_certificate`/`ssl_certificate_key`ni moslang.
#
# O'rnatishdan oldin: `nginx -t` bilan tekshiring, so'ng
# `systemctl reload nginx`. Mac'dagi Tailscale doim yoniq va ulangan
# bo'lishi shart (aks holda 502 Bad Gateway qaytadi).

upstream mac_frontend {
    server 100.69.182.71:5173;
}

upstream mac_backend {
    server 100.69.182.71:8000;
}

# --- HTTP -> HTTPS redirect (barcha subdomenlar) ---
server {
    listen 80;
    listen [::]:80;
    server_name qrbite.uz *.qrbite.uz;
    return 301 https://$host$request_uri;
}

# --- Frontend (market / admin / firma — bitta SPA, portal hostname bo'yicha aniqlanadi) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrbite.uz www.qrbite.uz admin.qrbite.uz firma.qrbite.uz;

    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;

    location / {
        proxy_pass http://mac_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite dev-server HMR (Hot Module Reload) WebSocket orqali ishlaydi —
        # shu header'lar bo'lmasa brauzerda konsolda uzilish/qayta ulanish
        # xatolari chiqadi (sahifa o'zi ishlaydi, lekin auto-reload buziladi).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Backend API (Google Login verify, Telegram webhook, va h.k.) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.qrbite.uz;

    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;

    # 3D model (GLB) va mahsulot rasm yuklashlar uchun — standart 1m juda kichik.
    client_max_body_size 100m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://mac_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bildirishnoma qo'ng'irog'i (WebSocket, Django Channels — qarang
    # apps/notifications/consumers.py). Upgrade/Connection header'lari
    # bo'lmasa nginx WS so'rovini oddiy HTTP GET'ga tushirib yuboradi,
    # Django esa buni 404 bilan rad etadi (frontend'dagi kabi HMR
    # WebSocket'i uchun ham xuddi shu header'lar kerak edi, qarang
    # yuqoridagi frontend serverdagi izoh). `proxy_read_timeout` uzunroq —
    # ulanish uzoq vaqt ochiq turishi kerak (30s HTTP polling emas endi).
    location /ws/ {
        proxy_pass http://mac_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
