# vidamarket.uz — yangi server (oddiy nginx; aaPanel shart emas).
#
# Portal xaritasi (frontend/src/portal.js bilan bir xil):
#   vidamarket.uz, www      -> market   (frontend/dist, SPA)
#   admin.vidamarket.uz     -> admin    (xuddi shu dist)
#   firma.vidamarket.uz     -> firma    (xuddi shu dist)
#   api.vidamarket.uz       -> Django (gunicorn 127.0.0.1:8180) + /ws/
#
# ESKI DOMEN (qrbite.uz): bozordagi eski ilova versiyalari `api.qrbite.uz`ga
# ulanadi — shuning uchun u hech bo'lmaganda hamma foydalanuvchi yangilangunga
# qadar (masalan 6-12 oy) o'sha backendga proksi qilinadi. Veb manzillar esa
# vidamarket.uz'ga 301 redirect qilinadi.
#
# SSL (wildcard, DNS-01):
#   certbot certonly --manual --preferred-challenges dns -d vidamarket.uz -d '*.vidamarket.uz'
#   certbot certonly --manual --preferred-challenges dns -d qrbite.uz -d '*.qrbite.uz'
# Tekshirish: `nginx -t && systemctl reload nginx`.
#
# Yo'llar: loyiha /srv/vida/app ga klonlangan deb faraz qilingan
# (deploy/MIGRATION.md bilan bir xil).

upstream vida_backend {
    server 127.0.0.1:8180;
    keepalive 16;
}

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name vidamarket.uz *.vidamarket.uz qrbite.uz *.qrbite.uz;
    return 301 https://$host$request_uri;
}

# --- Frontend (market / admin / firma) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vidamarket.uz www.vidamarket.uz admin.vidamarket.uz firma.vidamarket.uz;

    ssl_certificate     /etc/letsencrypt/live/vidamarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidamarket.uz/privkey.pem;

    root /srv/vida/app/frontend/dist;
    index index.html;

    # Joylashuvni aniqlash (firma sozlamalari, katalog) uchun.
    add_header Permissions-Policy "geolocation=(self)" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/vidamarket.access.log;
    error_log  /var/log/nginx/vidamarket.error.log;
}

# --- Backend API (yangi va eski domen bir xil backend) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vidamarket.uz;

    ssl_certificate     /etc/letsencrypt/live/vidamarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidamarket.uz/privkey.pem;

    client_max_body_size 100m;   # 3D model (GLB/USDZ) va rasm yuklashlar
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://vida_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bildirishnomalar WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://vida_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/vidamarket-api.access.log;
    error_log  /var/log/nginx/vidamarket-api.error.log;
}

# --- ESKI domen: API (eski ilova versiyalari uchun) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.qrbite.uz;

    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;

    client_max_body_size 100m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://vida_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://vida_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- ESKI domen: veb -> yangi domenga redirect ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrbite.uz www.qrbite.uz;
    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;
    return 301 https://vidamarket.uz$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.qrbite.uz;
    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;
    return 301 https://admin.vidamarket.uz$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name firma.qrbite.uz;
    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;
    return 301 https://firma.vidamarket.uz$request_uri;
}
