server {
    listen 80;
    listen [::]:80;
    server_name qrbite.uz www.qrbite.uz admin.qrbite.uz firma.qrbite.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrbite.uz www.qrbite.uz;

    ssl_certificate     /etc/letsencrypt/live/qrbite.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrbite.uz/privkey.pem;

    root /www/wwwroot/qrbite.uz/MebelMiniapp/frontend/dist;
    index index.html;

    # Firma sozlamalaridagi "Joylashuvni aniqlash" tugmasi uchun — aks holda
    # ba'zi hosting panellari (aaPanel) qo'shgan cheklovchi Permissions-Policy
    # "Geolocation has been disabled in this document" xatosini beradi.
    add_header Permissions-Policy "geolocation=(self)" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /www/wwwlogs/qrbite.uz.log;
    error_log  /www/wwwlogs/qrbite.uz.error.log;
}

