# Qdrant vektor bazasi — alohida mikroservis (rasmli qidiruv uchun).
# Ishga tushirish:  cd deploy/qdrant && docker compose up -d
# Faqat serverning o'zidan (127.0.0.1) ochiq — tashqariga chiqarmang.
# Boshqa serverda bo'lsa QDRANT__SERVICE__API_KEY ni o'rnating va
# backend/.env ga QDRANT_API_KEY yozing.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.0
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./storage:/qdrant/storage
    environment:
      # - QDRANT__SERVICE__API_KEY=uzun-maxfiy-kalit
      QDRANT__LOG_LEVEL: INFO
