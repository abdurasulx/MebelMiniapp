name: FurnitureScanner
options:
  bundleIdPrefix: uz.vida
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  FurnitureScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Mebel Scanner"
        NSCameraUsageDescription: "Mebel o‘lchamlarini AR orqali aniqlash uchun kamera kerak."
        NSPhotoLibraryAddUsageDescription: "Skan natijasini saqlash uchun rasmlar kutubxonasiga ruxsat kerak."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.vida.furniture-scanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: "BHMWKLT3YF"
        CODE_SIGN_STYLE: Automatic
schemes:
  FurnitureScanner:
    build:
      targets:
        FurnitureScanner: all
    run:
      config: Debug
