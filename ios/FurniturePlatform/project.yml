name: FurniturePlatform
options:
  bundleIdPrefix: uz.furnitureplatform
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  FurniturePlatform:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Mebelni AR orqali xonangizda ko'rish uchun kamera kerak."
        NSLocationWhenInUseUsageDescription: "Sizga yaqin viloyatdagi mahsulotlarni ko'rsatish uchun joylashuvingiz kerak."
        CFBundleDisplayName: "Furniture Platform"
        ITSAppUsesNonExemptEncryption: false
        # Google Cloud Console > Credentials > OAuth Client ID (iOS turi).
        GIDClientID: "857603145763-dorj27murelh0gkl5kgrkv579p9ftdfa.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.857603145763-dorj27murelh0gkl5kgrkv579p9ftdfa"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.furnitureplatform.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "B3D558FP56"
        CODE_SIGN_STYLE: Automatic
  FurniturePlatformUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.furnitureplatform.uitests
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: "B3D558FP56"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FurniturePlatform
schemes:
  FurniturePlatform:
    build:
      targets:
        FurniturePlatform: all
        FurniturePlatformUITests: [test]
    test:
      targets:
        - FurniturePlatformUITests
