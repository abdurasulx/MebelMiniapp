name: VidaMarket
options:
  bundleIdPrefix: uz.vida
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  VidaMarket:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: Resources/VidaMarket.entitlements
      properties:
        # Xcode Release/App Store imzolashda buni avtomatik "production"ga almashtiradi.
        aps-environment: development
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Mebelni AR orqali xonangizda ko'rish uchun kamera kerak."
        NSLocationWhenInUseUsageDescription: "Sizga yaqin viloyatdagi mahsulotlarni ko'rsatish uchun joylashuvingiz kerak."
        CFBundleDisplayName: "VIDA Market"
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        # DIQQAT: paket nomi uz.furnitureplatform.app'dan uz.vida.burchaksoft'ga
        # o'zgargani uchun bu OAuth client ENDI ESKI (noto'g'ri) — Google Sign-In
        # ishlashi uchun Google Cloud Console'da YANGI "iOS" turidagi OAuth
        # client yaratish kerak (Bundle ID: uz.vida.burchaksoft), so'ng shu
        # ikkala qiymatni (GIDClientID va pastdagi CFBundleURLSchemes) undan
        # olingan Client ID bilan almashtiring.
        GIDClientID: "857603145763-dorj27murelh0gkl5kgrkv579p9ftdfa.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.857603145763-dorj27murelh0gkl5kgrkv579p9ftdfa"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.vida.burchaksoft
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "BHMWKLT3YF"
        CODE_SIGN_STYLE: Automatic
  VidaMarketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.vida.burchaksoft.uitests
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: "BHMWKLT3YF"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VidaMarket
schemes:
  VidaMarket:
    build:
      targets:
        VidaMarket: all
        VidaMarketUITests: [test]
    test:
      targets:
        - VidaMarketUITests
