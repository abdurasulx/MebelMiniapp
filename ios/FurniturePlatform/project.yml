name: FurniturePlatform
options:
  bundleIdPrefix: uz.furnitureplatform
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  FurniturePlatform:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Mebelni AR orqali xonangizda ko'rish uchun kamera kerak."
        NSLocationWhenInUseUsageDescription: "Sizga yaqin viloyatdagi mahsulotlarni ko'rsatish uchun joylashuvingiz kerak."
        CFBundleDisplayName: "Furniture Platform"
        ITSAppUsesNonExemptEncryption: false
        # Google Cloud Console > Credentials > OAuth Client ID (iOS turi)dan
        # olinadi. TODO: Google Console ma'lumotlari kelgach shu ikkalasini
        # to'ldiring — GIDClientID shu Client ID'ning o'zi, URL scheme esa
        # SHU CLIENT ID'NING "TESKARI" SHAKLI (masalan Client ID
        # "123-abc.apps.googleusercontent.com" bo'lsa, scheme
        # "com.googleusercontent.apps.123-abc" bo'ladi — Console sahifasida
        # "iOS URL scheme" nomi bilan tayyor holda ham beriladi).
        GIDClientID: ""
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "REPLACE_WITH_REVERSED_IOS_CLIENT_ID"
        # Faqat lokal dev backend uchun (Mac'ning LAN/Tailscale IP'si, haqiqiy
        # qurilma shu orqali ulanadi). Prodda domen.uz HTTPS bo'lgani uchun kerak emas.
        NSAppTransportSecurity:
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.100.185:
              NSExceptionAllowsInsecureHTTPLoads: true
            100.69.182.71:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.furnitureplatform.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "B3D558FP56"
        CODE_SIGN_STYLE: Automatic
  FurniturePlatformUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.furnitureplatform.uitests
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: "B3D558FP56"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FurniturePlatform
schemes:
  FurniturePlatform:
    build:
      targets:
        FurniturePlatform: all
        FurniturePlatformUITests: [test]
    test:
      targets:
        - FurniturePlatformUITests
